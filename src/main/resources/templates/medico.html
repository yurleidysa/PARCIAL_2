<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Médico - Consultas Médicas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Consultas Médicas</span>
        <div class="d-flex align-items-center gap-3 text-white">
            <small>Médico - <span th:text="${nombreUsuario}">nombre</span></small>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div id="mensaje" class="alert d-none"></div>

    <h2 class="h5">Mis consultas asignadas</h2>
    <table class="table table-striped align-middle">
        <thead>
        <tr>
            <th>Paciente</th>
            <th>Motivo</th>
            <th>Consultorio</th>
            <th>Horario</th>
        </tr>
        </thead>
        <tbody id="tablaConsultas"></tbody>
    </table>
</div>

<script th:src="@{/js/comun.js}"></script>
<script th:src="@{/js/medico.js}"></script>
</body>
</html>
