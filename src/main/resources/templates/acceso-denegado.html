<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acceso denegado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container text-center mt-5" style="max-width: 500px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="display-6 text-danger">Acceso denegado</h1>
            <p class="mt-3 mb-1"
               th:text="${nombreUsuario != null} ? ${nombreUsuario} + ', tu usuario no tiene permisos para realizar esta acción.' : 'Tu usuario no tiene permisos para realizar esta acción.'">
                Tu usuario no tiene permisos para realizar esta acción.
            </p>
            <p class="text-muted small">Si necesitas este permiso, comunícate con el administrador.</p>
            <a th:href="@{/}" class="btn btn-outline-primary mt-2">Volver al inicio</a>
        </div>
    </div>
</div>
</body>
</html>
