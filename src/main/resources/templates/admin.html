<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administrador - Consultas Médicas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Consultas Médicas</span>
        <div class="d-flex align-items-center gap-3 text-white">
            <small>Administrador - <span th:text="${nombreUsuario}">nombre</span></small>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div id="mensaje" class="alert d-none"></div>

    <div class="card mb-4">
        <div class="card-body">
            <h2 class="h5 mb-3">Registrar consultorio</h2>
            <form id="formConsulta" class="row g-3">
                <div class="col-md-4">
                    <label for="nombrePaciente" class="form-label">Nombre del paciente</label>
                    <input id="nombrePaciente" class="form-control" maxlength="40" list="listaPacientes"
                           pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü0-9 ]+" title="Letras, números y espacios (máximo 40)" required>
                    <datalist id="listaPacientes"></datalist>
                </div>
                <div class="col-md-8">
                    <label for="motivo" class="form-label">Motivo de la consulta</label>
                    <input id="motivo" class="form-control" maxlength="100" required>
                </div>
                <div class="col-md-2">
                    <label for="numeroConsultorio" class="form-label">Consultorio</label>
                    <input id="numeroConsultorio" type="number" class="form-control" min="1" max="9999" step="1"
                           title="Número entre 1 y 9999" required>
                </div>
                <div class="col-md-2">
                    <label for="horaInicio" class="form-label">Hora de inicio</label>
                    <input id="horaInicio" type="time" class="form-control" required>
                </div>
                <div class="col-md-2">
                    <label for="horaFin" class="form-label">Hora de finalización</label>
                    <input id="horaFin" type="time" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label for="medico" class="form-label">Médico</label>
                    <select id="medico" class="form-select" required>
                        <option value="">Seleccione...</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <h2 class="h5">Consultas registradas</h2>
    <table class="table table-striped align-middle mb-5">
        <thead>
        <tr>
            <th>Paciente</th>
            <th>Motivo</th>
            <th>Consultorio</th>
            <th>Horario</th>
            <th>Médico</th>
        </tr>
        </thead>
        <tbody id="tablaConsultas"></tbody>
    </table>

    <div class="card mb-4">
        <div class="card-body">
            <h2 class="h5 mb-3" id="tituloMedico">Registrar médico</h2>
            <form id="formMedico" class="row g-3">
                <input type="hidden" id="idMedico">
                <div class="col-md-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input id="nombre" class="form-control" maxlength="50"
                           pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü ]+" title="Solo letras y espacios" required>
                </div>
                <div class="col-md-3">
                    <label for="apellido" class="form-label">Apellido</label>
                    <input id="apellido" class="form-control" maxlength="50"
                           pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü ]+" title="Solo letras y espacios" required>
                </div>
                <div class="col-md-3">
                    <label for="correo" class="form-label">Correo</label>
                    <input id="correo" type="email" class="form-control" maxlength="100" required>
                </div>
                <div class="col-md-3">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <input id="contrasena" type="password" class="form-control" minlength="4" maxlength="50"
                           title="Mínimo 4 caracteres" required>
                    <small id="ayudaContrasena" class="text-muted d-none">Déjela vacía para no cambiarla</small>
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100">Guardar</button>
                    <button type="button" id="btnCancelar" class="btn btn-outline-secondary d-none">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <h2 class="h5">Médicos</h2>
    <table class="table table-striped align-middle">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody id="tablaMedicos"></tbody>
    </table>
</div>

<script th:src="@{/js/comun.js}"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
