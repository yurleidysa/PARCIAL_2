<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Paciente - Consultas Médicas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Consultas Médicas</span>
        <div class="d-flex align-items-center gap-3 text-white">
            <small>Paciente - <span th:text="${nombreUsuario}">nombre</span></small>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div id="mensaje" class="alert d-none"></div>

    <div id="cardHorario" class="card mb-4 d-none">
        <div class="card-body">
            <h2 class="h5 mb-3" id="tituloHorario">Actualizar horario</h2>
            <form id="formHorario" class="row g-3">
                <input type="hidden" id="idConsulta">
                <div class="col-md-3">
                    <label for="horaInicio" class="form-label">Hora de inicio</label>
                    <input id="horaInicio" type="time" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label for="horaFin" class="form-label">Hora de finalización</label>
                    <input id="horaFin" type="time" class="form-control" required>
                </div>
                <div class="col-md-3 d-flex align-items-end gap-2">
                    <button type="submit" class="btn btn-primary w-100">Guardar</button>
                    <button type="button" id="btnCancelar" class="btn btn-outline-secondary">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <h2 class="h5">Mis citas</h2>
    <table class="table table-striped align-middle">
        <thead>
        <tr>
            <th>Motivo</th>
            <th>Consultorio</th>
            <th>Horario</th>
            <th>Médico</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody id="tablaConsultas"></tbody>
    </table>
</div>

<script th:src="@{/js/comun.js}"></script>
<script th:src="@{/js/paciente.js}"></script>
</body>
</html>
